paper:
  slug: on-the-illusion-of-gender-bias-in-face-recognition-explaining-the-fair
  title: "On the Illusion of Gender Bias in Face Recognition"
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  calfw_root: ../../datasets/calfw/extracted/calfw-hf
  cplfw_root: ../../datasets/cplfw/extracted/cplfw-hf
  root: ../../datasets/celeba/extracted/celeba
  train_ratio: 0.7
  max_images: null
model:
  image_size: 112
  emb_dim: 128
  pretrained: true
train:
  protocol: full
  seed: 42
  num_workers: 4
  batch_size: 64
  epochs: 8
  lr: 0.05
eval:
  batch_size: 128
  max_lfw_pairs: null
  n_pos_pairs: 2000
  n_neg_pairs: 2000
  min_filter_pairs: 40
paths:
  checkpoint_dir: outputs/checkpoints/full
  log_dir: outputs/logs/full
  pred_dir: outputs/predictions/full
  figure_dir: outputs/figures/full
device: cuda

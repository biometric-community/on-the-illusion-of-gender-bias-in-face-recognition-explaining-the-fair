paper:
  slug: on-the-illusion-of-gender-bias-in-face-recognition-explaining-the-fair
  title: "On the Illusion of Gender Bias in Face Recognition"
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  calfw_root: ../../datasets/calfw/extracted/calfw-hf
  cplfw_root: ../../datasets/cplfw/extracted/cplfw-hf
  root: ../../datasets/celeba/extracted/celeba
  train_ratio: 0.7
  max_images: 1024
model:
  image_size: 112
  emb_dim: 128
  pretrained: true
train:
  protocol: smoke
  seed: 42
  num_workers: 2
  batch_size: 32
  epochs: 1
  lr: 0.05
eval:
  batch_size: 64
  max_lfw_pairs: 200
  n_pos_pairs: 200
  n_neg_pairs: 200
  min_filter_pairs: 8
paths:
  checkpoint_dir: outputs/checkpoints/smoke
  log_dir: outputs/logs/smoke
  pred_dir: outputs/predictions/smoke
  figure_dir: outputs/figures/smoke
device: cuda
